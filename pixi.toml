[workspace]
authors = ["Marios Nikolaidis <marionik23@gmail.com>"]
name = "pyPGCF"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "2.0.1"
preview = ["pixi-build"]

[tasks]
pyPGCF = "python ./pypgcf/cli.py"
# test = "pytest tests/ -v"

[dependencies]
python = "==3.11"
iqtree = ">=3.0.1,<4"
muscle = "==3.8.1551"
eggnog-mapper = "==2.1.13"
fastani = ">=1.34,<2"
mcl = ">=22.282,<23"
dbcan = ">=5.2.8,<6"
ncbi-amrfinderplus = ">=3.12.8,<5"
antismash = ">=8.0.4,<9"
pip-system-certs = ">=5.3,<6"
ncbi-datasets-cli = ">=18.21.0,<19"
pandas = ">=3.0.1, <4"
openpyxl = ">=3.1.5, <4"
tqdm = ">=4.67.3, <5"
biopython = ">=1.8, <2"
requests = ">=2.32.5, <3"

[package.build.source]
path = "."

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.3.*", channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge", "https://prefix.dev/bioconda"] }
