[workspace]
authors = ["Marios Nikolaidis <marionik23@gmail.com>"]
name = "pyPGCF"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "2.0.1"
preview = ["pixi-build"]

[tasks]
pyPGCF = "python -m pypgcf"

# Core: species demarcation, orthologues, core, phylogenomic and download
[dependencies]
python = ">=3.11,<3.13"
iqtree = ">=3.0.1,<4"
muscle = "==3.8.1551"
blast = "*"
diamond = "*"
fastani = ">=1.34,<2"
mcl = ">=22.282,<23"
pip-system-certs = ">=5.3,<6"
ncbi-datasets-cli = ">=18.21.0,<19"
pandas = ">=3.0.1, <4"
scipy = ">=1.11, <2"
openpyxl = ">=3.1.5, <4"
tqdm = ">=4.67.3, <5"
biopython = ">=1.8, <2"
requests = ">=2.32.5, <3"
truststore = ">=0.10.5,<0.11"

# Functional annotation modules: eggnog, smbgc, cazy, amr
[feature.full.dependencies]
eggnog-mapper = "==2.1.13"
antismash = ">=8.0.4,<9"
dbcan = ">=5.2.8,<6"
ncbi-amrfinderplus = ">=3.12.8,<5"

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest tests/ -v"

[environments]
default = { solve-group = "default" }
full = { features = ["full"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[package.build.source]
path = "."

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.3.*", channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge", "https://prefix.dev/bioconda"] }
