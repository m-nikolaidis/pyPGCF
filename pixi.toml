[workspace]
authors = ["Marios Nikolaidis <marionik23@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "pyPGCF"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "1.3.0"
preview = ["pixi-build"]

[tasks]
pyPGCF = "python -c 'import pypgcf'"

[dependencies]
python = "==3.11"
iqtree = ">=3.0.1,<4"
muscle = "==3.8.1551"
eggnog-mapper = "==2.1.13"
fastani = ">=1.34,<2"
mcl = ">=22.282,<23"
dbcan = ">=5.2.8,<6"
ncbi-amrfinderplus = ">=3.12.8,<5"
antismash = ">=8.0.4,<9"
pip-system-certs = ">=5.3,<6"
ncbi-datasets-cli = ">=18.21.0,<19"

[pypi-dependencies]
pandas = ">=3.0.1, <4"
openpyxl = ">=3.1.5, <4"
tqdm = ">=4.67.3, <5"
biopython = ">=1.8, <2"
requests = ">=2.32.5, <3"
itaxotools-pygblocks = ">=0.1.0, <0.2"

[package.build.source]
path = "pypgcf"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.3.*" }
# backend = { name = "pixi-build-python", version = "0.1.0dev20250107152721" }
# backend = { name = "pixi-build-python", version = "*" }
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/bioconda",
]

[package.host-dependencies] 
hatchling = "==1.26.3"

[package.build-dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-mock = ">=3.0"
black = ">=22.0"
flake8 = ">=5.0"
mypy = ">=1.0"


