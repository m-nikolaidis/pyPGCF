package:
  name: pypgcf
  version: "2.0.1"

source:
  path: .

build:
  number: 0
  noarch: python
  script:
    - $PYTHON -m pip install --no-deps --no-build-isolation .

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - hatchling ==1.26.3
  run:
    - python >=3.11,<3.13
    - iqtree >=3.0.1,<4
    - muscle ==3.8.1551
    - blast
    - diamond
    - eggnog-mapper ==2.1.13
    - fastani >=1.34,<2
    - mcl >=22.282,<23
    - dbcan >=5.2.8,<6
    - ncbi-amrfinderplus >=3.12.8,<5
    - antismash >=8.0.4,<9
    - pip-system-certs >=5.3,<6
    - ncbi-datasets-cli >=18.21.0,<19
    - pandas>=3.0.1,<4
    - openpyxl>=3.1.5,<4
    - tqdm>=4.67.3,<5
    - requests>=2.32.5,<3
    - biopython>=1.8,<2
    - scipy>=1.11,<2

tests:
  - script:
      - python -c "import pypgcf"
      - python -c "from pypgcf._vendor.pygblocks import Options, compute_mask, trim_sequence"
      - python -c "from pypgcf.cli import main"
      - pyPGCF -h
      - pyPGCF core --help
      - python -m pypgcf -h

about:
  homepage: https://github.com/m-nikolaidis/pyPGCF
  repository: https://github.com/m-nikolaidis/pyPGCF
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Phylogenomics, species demarcation, and core and fingerprint proteins of bacterial genomes
