[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypgcf"
version = "2.0.0"
description = "pyPGCF: PhyloGenomic, Core and Fingerprint analyses package"
authors = [
      {name = "Marios Nikolaidis", email = "marionik23@gmail.com"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = "==3.11"
classifiers = [
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "License :: OSI Approved :: GNU General Public License (GPL)",
]

[project.optional-dependencies]
dev = [
      "pytest>=7.0",
      "pytest-cov>=4.0",
      "pytest-mock>=3.0",
      "black>=22.0",
      "flake8>=5.0",
      "mypy>=1.0",
]

[project.scripts]
pyPGCF = "pypgcf.cli:main"

[project.urls]
Homepage = "https://github.com/m-nikolaidis/pyPGCF"
Repository = "https://github.com/m-nikolaidis/pyPGCF"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
