[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypgcf"
version = "2.0.1"
description = "pyPGCF: PhyloGenomic, Core and Fingerprint analyses package"
authors = [
      {name = "Marios Nikolaidis", email = "marionik23@gmail.com"}
]
license = {text = "GPLv3"}
readme = "README.md"
dependencies = [
      "pandas>=3.0.1,<4",
      "openpyxl>=3.1.5,<4",
      "tqdm>=4.67.3,<5",
      "biopython>=1.8,<2",
      "requests>=2.32.5,<3",
      "scipy>=1.11,<2",
]
requires-python = ">=3.11,<3.13"
classifiers = [
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "License :: OSI Approved :: GNU General Public License (GPL)",
]

[project.optional-dependencies]
dev = [
      "pytest>=7.0",
      "pytest-cov>=4.0",
      "pytest-mock>=3.0",
      "black>=22.0",
      "flake8>=5.0",
      "mypy>=1.0",
]

[project.scripts]
pyPGCF = "pypgcf.cli:main"

[project.urls]
Homepage = "https://github.com/m-nikolaidis/pyPGCF"
Repository = "https://github.com/m-nikolaidis/pyPGCF"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "external: needs external bioinformatics tools or network access",
    "data: needs test data that is not included in the repository",
    "integration: downloads real databases (slow)",
    "slow: long-running test",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
