name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest flake8
      - name: Lint (syntax errors and undefined names only)
        run: flake8 --select=E9,F63,F7,F82 --show-source pypgcf tests
      - name: Unit tests
        run: pytest
      - name: Smoke test
        run: pyPGCF -h
