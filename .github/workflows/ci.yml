name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest flake8
      - name: Lint (syntax errors and undefined names only)
        run: flake8 --select=E9,F63,F7,F82 --show-source pypgcf tests
      - name: Unit tests
        run: pytest
      - name: Smoke test
        run: pyPGCF -h

  external-tools:
    # Core environment from pixi.lock, so tests run against the real tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pixi 0.62.2 (keeps pixi.lock at format v6)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/prefix-dev/pixi/releases/download/v0.62.2/pixi-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.local/bin" pixi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the core test environment
        run: pixi install -e test --locked
      - name: Check the environment provides every core module tool
        run: |
          pixi run -e test --locked python -c "
          from pypgcf import config, utils
          for m in ['species_demarcation', 'orthologues', 'orthologues_cds', 'phylogenomic', 'download']:
              utils.check_tools(config.MODULE_TOOLS[m])
          "
      - name: Tests with external tools
        run: pixi run -e test --locked test
